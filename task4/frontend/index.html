<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogSpace | Blogging Platform</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="#">BlogSpace</a>

    <div class="d-flex align-items-center gap-3">
        <span id="welcome" class="text-white"></span>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm">
            Logout
        </button>
    </div>
</nav>

<div class="container py-5">

    <!-- Authentication Section -->
    <section id="authSection" class="row justify-content-center">
        <div class="col-md-5">

            <div class="card shadow p-4">
                <h3 class="text-center mb-3">Welcome to BlogSpace</h3>

                <div class="mb-3">
                    <label class="form-label">Name (Register only)</label>
                    <input type="text" id="name" class="form-control"
                           placeholder="Enter your name">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control"
                           placeholder="Enter email">
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control"
                           placeholder="Enter password">
                </div>

                <div class="d-grid gap-2">
                    <button id="registerBtn" class="btn btn-primary">
                        Register
                    </button>

                    <button id="loginBtn" class="btn btn-dark">
                        Login
                    </button>
                </div>

                <p id="authMessage" class="text-center mt-3"></p>
            </div>

        </div>
    </section>

    <!-- Blog Section -->
    <section id="blogSection" hidden>

        <div class="card shadow-sm p-4 mb-5">
            <h3 id="formHeading">Create a New Blog</h3>

            <input type="text" id="title"
                   class="form-control mb-3"
                   placeholder="Enter blog title">

            <textarea id="content" class="form-control mb-3"
                      rows="5" placeholder="Write your blog here..."></textarea>

            <div class="d-flex gap-2">
                <button id="publishBtn" class="btn btn-primary">
                    Publish Blog
                </button>

                <button id="cancelEditBtn" class="btn btn-secondary"
                        hidden>
                    Cancel Edit
                </button>
            </div>

            <p id="blogMessage" class="mt-2"></p>
        </div>

        <h3 class="mb-4">Explore Blogs</h3>

        <div id="blogs" class="row g-4"></div>

    </section>

</div>

<script src="script.js"></script>
</body>
</html>
